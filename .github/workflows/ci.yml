# Two jobs, each shown as its own box on the run page:
#   unit         build + unit/contract tests (every push and PR)
#   integration  real deployment on minikube, then the black-box suites (needs unit); the Allure report is built
#                by the tests themselves (AllureReportListener), even when tests failed
# Deploy and tests share one job on purpose: the minikube cluster lives on the runner and cannot be passed to another job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run against the deployed stack
        type: choice
        options: [master, smoke, regression]
        default: master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUITE: ${{ inputs.suite || 'master' }}
  TEST_ENV: ci
  # Modules of the black-box tests; core is built through -am.
  TEST_MODULES: integration-tests/telemetry-ingest,integration-tests/trip-processor,integration-tests/scoring,integration-tests/policy-rating,integration-tests/rewards,integration-tests/e2e

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
      # Not a plain `./mvnw test`: from the root it would also start the black-box suites.
      - name: Unit and contract tests (also enforces the Jackson 3 rule)
        run: ./mvnw -B -ntp -pl commons,services/telemetry-ingest,services/trip-processor,services/scoring,services/policy-rating,services/rewards,integration-tests/core -am verify

  integration:
    name: Deploy to minikube and run ${{ inputs.suite || 'master' }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
      - name: 1. Start minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          cpus: 2
          memory: 6144m
      # Monitoring (Prometheus, Grafana) is left out to save memory.
      - name: 2. Deploy infra (Postgres, Kafka)
        run: platform/scripts/deploy.sh infra
      - name: 3. Deploy services
        run: |
          for svc in telemetry-ingest trip-processor scoring policy-rating notification-mock rewards; do
            platform/scripts/deploy.sh "$svc"
          done
          platform/scripts/deploy.sh status
      - name: 4. Port-forward
        run: |
          nohup platform/scripts/port-forward.sh > port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf localhost:8081/actuator/health >/dev/null && curl -sf localhost:8084/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat port-forward.log
          exit 1
      - name: 5. Run ${{ env.SUITE }} tests
        run: ./mvnw -B -ntp -fae -pl "$TEST_MODULES" -am test -Dsuite="$SUITE" -Denv="$TEST_ENV"
      - name: 6. Cluster state and service logs (on failure)
        if: failure()
        run: |
          kubectl -n safedrive get pods -o wide
          for svc in telemetry-ingest trip-processor scoring policy-rating notification-mock rewards; do
            echo "::group::$svc"; kubectl -n safedrive logs "deployment/$svc" --tail=300 || true; echo "::endgroup::"
          done
      - name: 7. Upload Allure reports and surefire output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports-${{ env.TEST_ENV }}
          path: |
            integration-tests/*/target/allure-report
            integration-tests/*/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

spring:
  application:
    name: gateway
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/safedrive}
    username: ${GATEWAY_DB_USER:gateway}
    password: ${GATEWAY_DB_PASSWORD}
  flyway:
    schemas: gateway
    default-schema: gateway

safedrive:
  gateway:
    issuer: ${GATEWAY_JWT_ISSUER:safedrive-gateway}
    audience: ${GATEWAY_JWT_AUDIENCE:safedrive}
    token-ttl-seconds: ${GATEWAY_TOKEN_TTL_S:3600}
    # PKCS#8 PEM private key. Empty means an ephemeral key is generated at startup (tokens die with the pod).
    jwt-private-key: ${GATEWAY_JWT_PRIVATE_KEY:}
    max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:1048576}
    connect-timeout-ms: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
    request-timeout-ms: ${GATEWAY_REQUEST_TIMEOUT_MS:10000}
    ingest-url: ${INGEST_URL:http://telemetry-ingest:8080}
    scoring-url: ${SCORING_URL:http://scoring:8080}
    rating-url: ${RATING_URL:http://policy-rating:8080}
    rewards-url: ${REWARDS_URL:http://rewards:8080}
    claims-url: ${CLAIMS_URL:http://claims:8080}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

server:
  port: ${PORT:8080}

spring:
  application:
    name: rewards
  datasource:
    url: ${REWARDS_DB_URL:jdbc:postgresql://localhost:5432/safedrive}
    username: ${REWARDS_DB_USER:rewards}
    password: ${REWARDS_DB_PASSWORD}
  flyway:
    schemas: rewards
    default-schema: rewards
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: rewards
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Only used to publish dead letters.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

safedrive:
  rewards:
    notification-url: ${NOTIFICATION_URL:http://localhost:8089}
    notification-timeout-ms: ${NOTIFICATION_TIMEOUT_MS:2000}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

server:
  port: ${PORT:8080}

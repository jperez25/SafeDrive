# The two edge services exposed as NodePorts, for load runs from outside the cluster (load.sh --mode nodeport).
# The base manifests stay ClusterIP; these extra Services select the same pods.
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingest-nodeport
  namespace: safedrive
spec:
  type: NodePort
  selector:
    app: telemetry-ingest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: policy-rating-nodeport
  namespace: safedrive
spec:
  type: NodePort
  selector:
    app: policy-rating
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30084

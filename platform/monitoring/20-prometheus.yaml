# Scrapes the four services (/actuator/prometheus) and kafka-exporter. Static targets: no service discovery needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: safedrive
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["telemetry-ingest:8080"]
            labels: { service: telemetry-ingest }
          - targets: ["trip-processor:8080"]
            labels: { service: trip-processor }
          - targets: ["scoring:8080"]
            labels: { service: scoring }
          - targets: ["policy-rating:8080"]
            labels: { service: policy-rating }
          - targets: ["rewards:8080"]
            labels: { service: rewards }
      - job_name: kafka
        static_configs:
          - targets: ["kafka-exporter:9308"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: safedrive
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: safedrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config

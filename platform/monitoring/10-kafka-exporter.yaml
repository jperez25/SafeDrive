# Consumer lag and topic offsets as Prometheus metrics (kafka_consumergroup_lag, ...).
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: safedrive
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: safedrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args: ["--kafka.server=kafka:9092"]
          ports:
            - containerPort: 9308
          readinessProbe:
            httpGet: { path: /healthz, port: 9308 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }

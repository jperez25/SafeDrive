apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: safedrive
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: safedrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: safedrive/gateway:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_DB_URL
              value: jdbc:postgresql://postgres:5432/safedrive
            - name: GATEWAY_DB_USER
              value: gateway
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: GATEWAY_DB_PASSWORD
            - name: GATEWAY_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt
                  key: GATEWAY_JWT_PRIVATE_KEY
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }

apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingest
  namespace: safedrive
spec:
  selector:
    app: telemetry-ingest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  namespace: safedrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ingest
  template:
    metadata:
      labels:
        app: telemetry-ingest
    spec:
      containers:
        - name: telemetry-ingest
          image: safedrive/telemetry-ingest:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: INGEST_DB_URL
              value: jdbc:postgresql://postgres:5432/safedrive
            - name: INGEST_DB_USER
              value: ingest
            - name: INGEST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: INGEST_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }

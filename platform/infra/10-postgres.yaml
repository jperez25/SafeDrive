# One Postgres instance, one database (safedrive), one schema and one login role per service.
# The init script runs only on the first start of an empty data volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: safedrive
data:
  10-schemas.sh: |
    #!/bin/bash
    set -euo pipefail

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    REVOKE CONNECT ON DATABASE safedrive FROM PUBLIC;
    SQL

    create_service() {
      local name="$1" password="$2"
      psql -v ON_ERROR_STOP=1 -v pw="$password" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE ROLE ${name} LOGIN PASSWORD :'pw';
    CREATE SCHEMA ${name} AUTHORIZATION ${name};
    ALTER ROLE ${name} SET search_path = ${name};
    GRANT CONNECT ON DATABASE safedrive TO ${name};
    SQL
    }

    create_service ingest  "$INGEST_DB_PASSWORD"
    create_service trip    "$TRIP_DB_PASSWORD"
    create_service scoring "$SCORING_DB_PASSWORD"
    create_service rating  "$RATING_DB_PASSWORD"
    create_service rewards "$REWARDS_DB_PASSWORD"

    # Local admin login to inspect every schema (superuser, dev only).
    psql -v ON_ERROR_STOP=1 -v pw="$SAFEDRIVER_DB_PASSWORD" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE safedriver LOGIN SUPERUSER PASSWORD :'pw';
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: safedrive
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: safedrive
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: safedrive
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "safedrive"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "safedrive"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
